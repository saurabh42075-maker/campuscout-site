# Static site published from the repo root, plus one function for the chat assistant.
[build]
  publish = "."

# Older Netlify sites default to an old Node.js; the Anthropic SDK needs a modern one.
[build.environment]
  NODE_VERSION = "22"

# Canonical page URLs end in .html (see CLAUDE.md). Stop Netlify rewriting links
# to the extensionless form, and send the extensionless form to the .html page.
[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/india"
  to = "/india.html"
  status = 301
  force = true

